# ============================================================
# write-to-trenddb Helm Chart 默认配置
# ============================================================

# ── 镜像 ──────────────────────────────────────────────────
image:
  repository: 10.253.3.91:30550/library/write-to-trenddb
  tag: "3.0.1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-secret

# ── KubeEdge 边缘节点调度 ──────────────────────────────────
tolerations:
  - key: node-role.kubernetes.io/edge
    operator: Exists
    effect: NoSchedule

# hostNetwork 使服务可直接访问节点物理 IP（TrendDB5 / EMQX）
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

# ── 资源限制 ──────────────────────────────────────────────
resources:
  requests:
    cpu: "2"
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 2Gi

# ── 日志文件持久化（hostPath 挂载到节点本地路径）─────────
# 日志文件通过 hostPath 挂载写入边缘节点，支持按大小自动轮转。
# ConfigMap 模板会从此段构建完整的 Serilog 配置（Console + File sink）。
logFile:
  enabled: true
  hostPath: /opt/write-to-trenddb/logs       # 边缘节点本地日志目录（部署前需 mkdir）
  mountPath: /logs                            # 容器内挂载路径（日志文件写入此目录）
  fileSizeLimitMB: 10                         # 单个日志文件最大 MB（超出自动轮转）
  retainedFileCountLimit: 30                   # 最多保留的日志文件数（超出自动删除旧文件）
  consoleLevel: Information                    # 控制台输出最低日志等级
  fileLevel: Information                       # 写入文件的日志最低等级

# ── appsettings.json 配置内容（渲染为 ConfigMap 挂载到容器）──
# 修改此处后执行 helm upgrade 即可，无需重建镜像
appSettings:
  Logging:
    LogLevel:
      Default: Information
      "Microsoft.Hosting.Lifetime": Information
      WriteToTrendDb: Information

  TrendDb5:
    # 支持多个数据库，逗号分隔多个 SERVER=...;DATABASE=...
    ConnectionString: "Type=TrendDB5;SERVER=127.0.0.1:20010;DATABASE=db01;UID=system;PWD=luculent123@,SERVER=127.0.0.1:20020;DATABASE=db02;UID=system;PWD=luculent123@"
    PoolSize: 7
    WriteIntervalSeconds: 1

  Mqtt:
    Broker: "192.168.122.231"
    Port: 1884
    ClientId: "trenddb-writer"
    Username: "sys"
    Password: "Luculent1!"
    # 订阅的 MQTT 主题列表（支持多个，对应多个 mapper 实例）
    Topics:
      - "device/sis/data"
    # 收包线程 → 消费线程 之间的有界队列容量（条消息）。
    # 满时丢最旧（DropOldest）。单位是「消息条数」而非测点数，
    # 容量越大内存占用越高（单条 ≈ 点数 × ~70 字节），测点量越大反而应调小以免 OOM。
    ChannelCapacity: 256
    # MQTT 底层 TCP socket 接收缓冲区（字节）。默认 8KB 在云边高延迟链路下
    # 会把 TCP 接收窗口卡死在 ~14KB，吞吐上限 ~1.4MB/s，导致 EMQX 发送队列堆积断连。
    SocketBufferSize: 1048576

  # 点表 CSV 文件在容器内的路径，由下方 pointsFile.hostPath 挂载到节点本地文件
  PointsFilePath: "/config/points.csv"

# ── 点表文件 hostPath 挂载 ────────────────────────────────
# 将边缘节点上的本地 CSV 文件直接挂载进容器，避免 ConfigMap 体积限制。
# 更新点表只需替换节点上的文件并重启 Pod，无需重新 helm upgrade。
pointsFile:
  # 边缘节点上的绝对路径（需提前将 points.csv 上传到该路径）
  hostPath: /opt/write-to-trenddb/config/points.csv
  # 容器内挂载路径（与 PointsFilePath 保持一致）
  mountPath: /config/points.csv
