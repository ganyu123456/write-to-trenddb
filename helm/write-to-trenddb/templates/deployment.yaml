apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "write-to-trenddb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "write-to-trenddb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "write-to-trenddb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "write-to-trenddb.selectorLabels" . | nindent 8 }}
      # 配置变更时触发 Pod 滚动更新（ConfigMap 内容变化时自动重启）
      annotations:
        checksum/config: {{ printf "%s%s" (.Values.appSettings | toJson) (.Values.logFile | toJson) | sha256sum }}
    spec:
      {{- if .Values.nodeName }}
      nodeName: {{ .Values.nodeName }}
      {{- end }}

      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      restartPolicy: Always

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            # appsettings.json 由 ConfigMap 注入，.NET 配置系统自动加载
            - name: app-config
              mountPath: /app/appsettings.json
              subPath: appsettings.json
              readOnly: true
            # 点表 CSV 由边缘节点 hostPath 直接挂载，文件过大不适合放 ConfigMap
            - name: points-csv
              mountPath: {{ .Values.pointsFile.mountPath }}
              readOnly: true
            {{- if .Values.logFile.enabled }}
            # 日志文件输出到节点本地目录（支持轮转后持久化）
            - name: logs
              mountPath: {{ .Values.logFile.mountPath }}
            {{- end }}

      volumes:
        - name: app-config
          configMap:
            name: {{ include "write-to-trenddb.configmapName" . }}
        # hostPath 挂载节点本地点表文件，更新时只需替换文件并重启 Pod
        - name: points-csv
          hostPath:
            path: {{ .Values.pointsFile.hostPath }}
            type: File
        {{- if .Values.logFile.enabled }}
        # 日志目录挂载到节点本地路径，日志文件轮转后持久保留
        - name: logs
          hostPath:
            path: {{ .Values.logFile.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
